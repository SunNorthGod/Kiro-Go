    <script>
      (function () {
        try {
          var p = localStorage.getItem('kiro_theme');
          var dark = p === 'dark' || ((p !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
