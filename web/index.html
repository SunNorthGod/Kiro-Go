<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NorthGod Kiro-Go</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/admin/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/admin/favicon-128.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/admin/favicon-180.png" />
  <script src="/admin/vendor/tailwindcss-browser/index.global.js"></script>
  <script src="/admin/vendor/chartjs/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/admin/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/admin/styles.css" id="__cssAsset" />
  <link rel="stylesheet" href="/admin/toast.css" id="__toastCss" />
  <script>
    (function () {
      var v = Date.now();
      window.__v = v;
      var css = document.getElementById('__cssAsset');
      if (css) css.href = '/admin/styles.css?v=' + v;
      var tcss = document.getElementById('__toastCss');
      if (tcss) tcss.href = '/admin/toast.css?v=' + v;
    })();
  </script>
  <style>
    /* Component-level styles owned by index.html (never edit styles.css).
       Everything below reuses design tokens so both themes stay in sync. */

    /* Overview chart cards */
    .ov-chart-card .card-header { margin-bottom: 0.85rem; }
    .ov-chart-card .card-title-icon { color: var(--muted-foreground); margin-right: 0.45rem; font-size: 0.8125rem; }
    /* ng-stat value doubling as an RPM badge */
    .ng-stat-value.ng-rpm { font-size: 1.7rem; }
    .ng-stat-value.ng-rpm .ng-rpm-dot { width: 9px; height: 9px; }
    /* RPM figures are intentionally neutral: no green, no pulse. Safety net in
       case the live-pulse class ever lands on an RPM badge. */
    .ng-rpm-live .ng-rpm-dot { background: var(--muted-foreground); animation: none; }

    /* Collapsible advanced settings */
    details.ng-advanced { border: 0; background: transparent; padding: 0; }
    details.ng-advanced > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 1rem 1.5rem; border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--card); font-size: 0.9375rem; font-weight: 600; color: var(--foreground); user-select: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    details.ng-advanced > summary::-webkit-details-marker { display: none; }
    details.ng-advanced > summary:hover { background: var(--muted); border-color: var(--border-focus); }
    details.ng-advanced[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .ng-advanced-title { display: inline-flex; align-items: center; gap: 0.5rem; }
    .ng-advanced-title i { color: var(--muted-foreground); font-size: 0.8125rem; }
    .ng-advanced-chevron { transition: transform 0.18s ease; color: var(--muted-foreground); font-size: 0.8125rem; }
    details.ng-advanced[open] .ng-advanced-chevron { transform: rotate(180deg); }
    .ng-advanced-body { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; }

    /* Add-account single modal: method tabs */
    .add-method-tabs { display: flex; flex-wrap: wrap; gap: 0.375rem; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .add-method-tab {
      appearance: none; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground);
      font: inherit; font-size: 0.8125rem; font-weight: 500; padding: 0.4rem 0.75rem; border-radius: var(--radius-md);
      cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .add-method-tab:hover { border-color: var(--border-focus); color: var(--foreground); }
    .add-method-tab.active { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }

    /* Keys: full key + one-click copy row */
    .ng-key-copyrow { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
    .ng-key-full {
      flex: 1 1 12rem; min-width: 0; font-family: var(--font-mono); font-size: 0.75rem; color: var(--foreground);
      background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 0.34rem 0.5rem; overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
    }
    /* Keys per-row RPM chip sits inline with meta */
    .key-meta.ng-rpm { gap: 0.3rem; }

    /* Selects inside ng-toolbar: the native <select> is visually hidden after
       enhancement, so size the custom-select wrapper explicitly. */
    .ng-toolbar > .custom-select { flex: 0 0 auto; width: 11rem; }
    @media (max-width: 640px) {
      .ng-toolbar > .custom-select { flex: 1 1 100%; width: 100%; }
    }
  </style>
</head>

<body>
  <!-- Login -->
  <div id="loginPage" class="login-wrapper">
    <div class="ghost-bg" aria-hidden="true">
      <i class="fa-solid fa-ghost ghost ghost-1"></i>
      <i class="fa-solid fa-ghost ghost ghost-2"></i>
      <i class="fa-solid fa-ghost ghost ghost-3"></i>
      <i class="fa-solid fa-ghost ghost ghost-4"></i>
      <i class="fa-solid fa-ghost ghost ghost-5"></i>
      <i class="fa-solid fa-ghost ghost ghost-6"></i>
      <i class="fa-solid fa-ghost ghost ghost-7"></i>
      <i class="fa-solid fa-ghost ghost ghost-8"></i>
      <i class="fa-solid fa-ghost ghost ghost-9"></i>
      <i class="fa-solid fa-ghost ghost ghost-10"></i>
      <i class="fa-solid fa-ghost ghost ghost-11"></i>
      <i class="fa-solid fa-ghost ghost ghost-12"></i>
    </div>
    <header class="login-topbar">
      <div class="login-topbar-inner">
        <div class="brand" aria-label="NorthGod Kiro-Go" data-i18n-aria-label="app.title">
          <img class="brand-icon brand-logo" src="/admin/logo.png" alt="" />
          <span class="brand-text">NorthGod Kiro-Go</span>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" id="loginLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
          </div>
          <span class="divider" aria-hidden="true"></span>
          <button id="loginThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
        </div>
      </div>
    </header>
    <main class="login-main">
      <div class="login-box">
        <h1 class="login-title" data-i18n="login.title"></h1>
        <p class="login-subtitle" data-i18n="login.subtitle"></p>
        <div class="form-group">
          <label data-i18n="login.password"></label>
          <div class="input-affix">
            <i class="fa-solid fa-lock affix-icon"></i>
            <input type="password" id="pwdField" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="off" />
            <button type="button" class="affix-btn" id="pwdToggle" aria-label=""
              data-i18n-aria-label="login.showPassword" data-shown="false">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <label class="remember-row" for="rememberPwd">
          <input type="checkbox" id="rememberPwd" />
          <span class="remember-box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
          <span class="remember-label" data-i18n="login.remember"></span>
        </label>
        <button type="button" class="btn btn-primary btn-lg w-full" id="loginBtn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span data-i18n="login.submit"></span>
        </button>

      </div>
    </main>
  </div>

  <!-- Main app -->
  <div id="mainPage" class="hidden">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand-wrap">
          <div class="brand">
            <img class="brand-icon brand-logo" src="/admin/logo.png" alt="" />
            <span class="brand-text">NorthGod Kiro-Go</span>
          </div>
        </div>
        <nav class="header-nav" aria-label="" data-i18n-aria-label="aria.sections">
          <div class="tabs" id="tabBar">
            <button type="button" class="tab active" data-tab="overview"><i
                class="fa-solid fa-gauge-high tab-icon"></i><span data-i18n="tabs.overview"></span></button>
            <button type="button" class="tab" data-tab="accounts"><i class="fa-solid fa-users tab-icon"></i><span
                data-i18n="tabs.accounts"></span></button>
            <button type="button" class="tab" data-tab="keys"><i class="fa-solid fa-ticket tab-icon"></i><span
                data-i18n="tabs.keys"></span></button>
            <button type="button" class="tab" data-tab="settings"><i class="fa-solid fa-sliders tab-icon"></i><span
                data-i18n="tabs.settings"></span></button>
            <button type="button" class="tab" data-tab="logs"><i class="fa-solid fa-list tab-icon"></i><span
                data-i18n="tabs.logs"></span></button>
          </div>
        </nav>
        <div class="topbar-actions flex-wrap justify-end">
          <div class="lang-switch" id="mainLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
          </div>
          <button id="mainThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="btn btn-outline btn-sm" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span data-i18n="common.logout"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- Overview tab -->
      <div id="tabOverview" class="tab-content">
        <div class="card">
          <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-gauge-high card-title-icon"></i><span
                data-i18n="overview.title"></span></span>
          </div>
          <div id="ovStatGrid" class="ov-sections"></div>
        </div>

        <div class="ng-grid ng-grid-2">
          <div class="card ov-chart-card">
            <div class="card-header"><span class="card-title"><i class="fa-solid fa-wave-square card-title-icon"></i><span
                  data-i18n="overview.rpmTrend"></span></span></div>
            <div class="ng-chart"><canvas id="ovRpmChart"></canvas></div>
          </div>
          <div class="card ov-chart-card">
            <div class="card-header"><span class="card-title"><i class="fa-solid fa-chart-line card-title-icon"></i><span
                  data-i18n="overview.tokenTrend"></span></span></div>
            <div class="ng-chart"><canvas id="ovTokenChart"></canvas></div>
          </div>
        </div>

        <div class="card ov-daily-card">
          <div class="card-header"><span class="card-title"><i class="fa-solid fa-table-list card-title-icon"></i><span
                data-i18n="overview.dailyTable"></span></span></div>
          <div id="ovDailyTable" class="ov-daily-table"></div>
        </div>
      </div>

      <!-- Accounts tab -->
      <div id="tabAccounts" class="tab-content hidden">
        <div class="ng-grid" id="accountsStats"></div>
        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="accounts.title"></span>
            <div class="card-actions">
              <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fa-solid fa-file-export"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.export"></span></button>
              <button class="btn btn-outline btn-sm" id="refreshAllModelsBtn"><i class="fa-solid fa-arrows-rotate"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="models.refreshAll"></span></button>
              <button class="btn btn-primary btn-sm" id="addAccountBtn"><i class="fa-solid fa-plus"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.add"></span></button>
            </div>
          </div>

          <div class="toolbar">
            <label class="flex items-center gap-1.5 cursor-pointer select-none shrink-0">
              <input type="checkbox" id="selectAllCheckbox" />
              <span class="text-xs" data-i18n="batch.selectAll"></span>
            </label>
            <div id="batchBar" class="batch-bar hidden">
              <span id="batchCount" class="batch-count"></span>
              <button class="btn btn-primary btn-xs" data-batch="enable" data-i18n="batch.enable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="disable" data-i18n="batch.disable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refresh" data-i18n="batch.refresh"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refreshModels"
                data-i18n="batch.refreshModels"></button>
              <button class="btn btn-danger btn-xs" data-batch="delete" data-i18n="batch.delete"></button>
            </div>
          </div>

          <div class="ng-toolbar ng-filter-toolbar">
            <input type="text" id="filterSearch" class="ng-toolbar-grow" data-i18n-placeholder="filter.search" />
            <div class="ng-field">
              <span class="ng-field-label"><i class="fa-solid fa-filter" aria-hidden="true"></i><span
                  data-i18n="filter.status"></span></span>
              <select id="filterStatusSelect" data-i18n-aria-label="filter.status">
                <option value="all" data-i18n="filter.all"></option>
                <option value="enabled" data-i18n="filter.enabled"></option>
                <option value="disabled" data-i18n="filter.disabled"></option>
                <option value="banned" data-i18n="filter.banned"></option>
              </select>
            </div>
            <div class="ng-field">
              <span class="ng-field-label"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span
                  data-i18n="accounts.sortLabel"></span></span>
              <select id="accountsSortSelect" data-i18n-aria-label="accounts.sortLabel">
                <option value="priority" data-i18n="accounts.sortPriority"></option>
                <option value="rpm" data-i18n="accounts.sortRpm"></option>
                <option value="usage" data-i18n="accounts.sortUsage"></option>
              </select>
            </div>
          </div>

          <div id="accountsList" class="ng-list"></div>
        </div>
      </div>

      <!-- Keys (card billing) tab -->
      <div id="tabKeys" class="tab-content hidden">
        <div class="ng-grid" id="keysStats"></div>
        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="keys.title"></span>
            <div class="card-actions">
              <button class="btn btn-primary btn-sm" id="keysAddBtn"><i class="fa-solid fa-plus"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="keys.add"></span></button>
            </div>
          </div>
          <p class="card-subtitle" data-i18n="keys.subtitle"></p>
          <div class="ng-toolbar keys-toolbar ng-filter-toolbar">
            <input type="text" id="keysSearch" class="ng-toolbar-grow" data-i18n-placeholder="keys.search" />
            <div class="ng-field">
              <span class="ng-field-label"><i class="fa-solid fa-filter" aria-hidden="true"></i><span
                  data-i18n="keys.filterLabel"></span></span>
              <select id="keysFilterSelect" data-i18n-aria-label="keys.filterAll">
                <option value="all" data-i18n="keys.filterAll"></option>
                <option value="active" data-i18n="keys.filterActive"></option>
                <option value="disabled" data-i18n="keys.filterDisabled"></option>
                <option value="expired" data-i18n="keys.filterExpired"></option>
                <option value="sub" data-i18n="keys.filterSub"></option>
              </select>
            </div>
            <div class="ng-field">
              <span class="ng-field-label"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span
                  data-i18n="keys.sortLabel"></span></span>
              <select id="keysSortSelect" data-i18n-aria-label="keys.sortLabel">
                <option value="balance" data-i18n="keys.sortBalance"></option>
                <option value="rpm" data-i18n="keys.sortRpm"></option>
                <option value="createdDesc" data-i18n="keys.sortCreatedDesc"></option>
              </select>
            </div>
          </div>
          <div id="keysList" class="ng-list"></div>
        </div>
      </div>

      <!-- Settings tab -->
      <div id="tabSettings" class="tab-content hidden">
        <!-- Admin password -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.adminPassword"></span></div>
          <div class="form-group">
            <label data-i18n="settings.newPassword"></label>
            <input type="password" id="newPassword" data-i18n-placeholder="settings.newPasswordPlaceholder" />
          </div>
          <button class="btn btn-primary" id="changePasswordBtn" data-i18n="settings.changePassword"></button>
        </div>

        <!-- Outbound proxy -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.proxySettings"></span></div>
          <div class="form-group">
            <label data-i18n="settings.proxyType"></label>
            <select id="proxyType">
              <option value="none" data-i18n="settings.proxyNone"></option>
              <option value="socks5" data-i18n="settings.proxySocks5"></option>
              <option value="http" data-i18n="settings.proxyHttp"></option>
            </select>
          </div>
          <div id="proxyFields" class="hidden">
            <div class="form-group">
              <label data-i18n="settings.proxyHost"></label>
              <div class="input-row">
                <input type="text" id="proxyHost" placeholder="127.0.0.1" />
                <input type="number" id="proxyPort" class="w-24!" placeholder="1080" min="1" max="65535" />
              </div>
            </div>
            <div class="form-group">
              <label data-i18n="settings.proxyAuth"></label>
              <div class="input-row">
                <input type="text" id="proxyUsername" data-i18n-placeholder="settings.proxyUsername"
                  autocomplete="off" />
                <input type="password" id="proxyPassword" data-i18n-placeholder="settings.proxyPassword"
                  autocomplete="new-password" />
              </div>
            </div>
          </div>
          <button class="btn btn-primary" id="saveProxyBtn" data-i18n="settings.saveProxy"></button>
        </div>

        <!-- Advanced settings (collapsed) -->
        <details class="ng-advanced" id="advancedSettings">
          <summary>
            <span class="ng-advanced-title"><i class="fa-solid fa-gears"></i><span
                data-i18n="settings.advanced"></span></span>
            <i class="fa-solid fa-chevron-down ng-advanced-chevron" aria-hidden="true"></i>
          </summary>
          <div class="ng-advanced-body">
            <!-- Endpoint settings -->
            <div class="card">
              <div class="card-header"><span class="card-title" data-i18n="settings.endpointSettings"></span></div>
              <div class="form-group">
                <label data-i18n="settings.preferredEndpoint"></label>
                <select id="preferredEndpoint">
                  <option value="auto" data-i18n="settings.endpointAuto"></option>
                  <option value="kiro" data-i18n="settings.endpointKiro"></option>
                  <option value="codewhisperer" data-i18n="settings.endpointCodeWhisperer"></option>
                  <option value="amazonq" data-i18n="settings.endpointAmazonQ"></option>
                </select>
                <small data-i18n="settings.endpointHint"></small>
              </div>
              <div class="form-group">
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="endpointFallback" checked /><span
                      class="slider"></span></span>
                  <span data-i18n="settings.endpointFallback"></span>
                </label>
                <small data-i18n="settings.endpointFallbackHint"></small>
              </div>
              <button class="btn btn-primary" id="saveEndpointBtn" data-i18n="settings.saveEndpoint"></button>
            </div>

            <!-- Prompt filter -->
            <div class="card">
              <div class="card-header"><span class="card-title" data-i18n="settings.promptFilter"></span></div>
              <div class="form-group">
                <label class="font-semibold pb-2 block" data-i18n="settings.builtinFilters"></label>
            <div class="flex flex-col gap-3">
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterClaudeCode" /><span
                      class="slider"></span></span>
                  <span data-i18n="settings.filterClaudeCode"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterClaudeCodeHint"></small>
              </div>
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterEnvNoise" /><span class="slider"></span></span>
                  <span data-i18n="settings.filterEnvNoise"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterEnvNoiseHint"></small>
              </div>
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterStripBoundaries" /><span
                      class="slider"></span></span>
                  <span data-i18n="settings.filterStripBoundaries"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterStripBoundariesHint"></small>
              </div>
            </div>
          </div>
          <div class="form-group mt-4">
            <label class="font-semibold pb-2 block" data-i18n="settings.customRules"></label>
            <div id="promptFilterRules" class="mb-2"></div>
            <div class="flex gap-2 flex-wrap items-center">
              <button class="btn btn-outline btn-sm" id="addRuleRegexBtn" data-i18n="promptFilter.addRegex"></button>
              <button class="btn btn-outline btn-sm" id="addRuleContainsBtn"
                data-i18n="promptFilter.addContains"></button>
              <button class="btn btn-primary btn-sm" id="savePromptFilterBtn"
                data-i18n="settings.savePromptFilter"></button>
            </div>
          </div>
            </div>
          </div>
        </details>
      </div>

      <!-- Logs tab -->
      <div id="tabLogs" class="tab-content hidden">
        <div class="card">
          <div class="card-header logs-header">
            <span class="card-title" data-i18n="logs.title"></span>
            <div class="ng-toolbar logs-actions">
              <select id="logsFilterSelect" class="w-40!" data-i18n-aria-label="logs.filter">
                <option value="all" data-i18n="logs.filterAll"></option>
                <option value="success" data-i18n="logs.filterSuccess"></option>
                <option value="error" data-i18n="logs.filterError"></option>
              </select>
              <button class="btn btn-danger btn-sm" id="logsClearBtn"><i class="fa-solid fa-trash"></i><span class="btn-text" data-i18n="logs.clear"></span></button>
            </div>
          </div>
          <div class="logs-summary" id="logsSummary"></div>
          <div id="logsList" class="logs-list">
            <p class="text-muted" data-i18n="logs.empty"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer" aria-label="" data-i18n-aria-label="aria.footer">
      <div class="app-footer-inner">
        <div class="footer-panel">
          <div class="footer-identity">
            <img class="footer-icon footer-logo" src="/admin/logo.png" alt="" />
            <div class="footer-copy">
              <div class="footer-title-row">
                <span class="footer-title">NorthGod Kiro-Go</span>
                <span class="footer-version" id="versionBadge" aria-label=""
                  data-i18n-aria-label="aria.currentVersion"></span>
                <span class="footer-version-status" id="statusBadge" data-i18n-title="status.running" title="">
                  <span class="status-dot"></span>
                </span>
              </div>

            </div>
          </div>
          <div class="footer-actions">
            <nav class="footer-links" aria-label="" data-i18n-aria-label="aria.resources">
              <a class="footer-link" href="/user" target="_blank" rel="noopener">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                <span data-i18n="footer.userPortal"></span>
              </a>
            </nav>
          </div>
        </div>
        <div class="footer-meta">
          <span>© <span id="footerYear"></span> NorthGod Kiro-Go</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Modals -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><span class="modal-title" id="modalTitle"></span><button class="modal-close"
          id="addModalClose" type="button" aria-label="" data-i18n-aria-label="common.close">&times;</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><span class="modal-title" data-i18n="detail.title"></span><button class="modal-close"
          id="detailModalClose" type="button" aria-label="" data-i18n-aria-label="common.close">&times;</button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>
  <div id="exportModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><span class="modal-title" data-i18n="export.title"></span><button class="modal-close"
          id="exportModalClose" type="button" aria-label="" data-i18n-aria-label="common.close">&times;</button></div>
      <div class="modal-body" id="exportBody"></div>
    </div>
  </div>
  <div id="testModal" class="modal">
    <div class="modal-content test-modal-content">
      <div class="modal-header"><span class="modal-title" data-i18n="accounts.testModalTitle"></span><button
          class="modal-close" id="testModalClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button></div>
      <div class="modal-body" id="testBody"></div>
    </div>
  </div>
  <div id="confirmModal" class="modal">
    <div class="modal-content confirm-modal-content">
      <div class="modal-header"><span class="modal-title" id="confirmTitle"></span><button class="modal-close"
          id="confirmClose" type="button" aria-label="" data-i18n-aria-label="common.close">&times;</button></div>
      <div class="modal-body">
        <p class="confirm-message" id="confirmMessage"></p>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="confirmCancel" type="button" data-i18n="common.cancel"></button>
          <button class="btn btn-primary" id="confirmOk" type="button" data-i18n="common.confirm"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="apiKeyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="apiKeyModalTitle" data-i18n="apiKeys.modalTitleCreate"></span>
        <button class="modal-close" id="apiKeyModalClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-section-title" data-i18n="apiKeys.sectionBasic"></div>
        <div class="form-group">
          <label data-i18n="apiKeys.formName"></label>
          <input type="text" id="apiKeyForm_name" data-i18n-placeholder="apiKeys.formNamePlaceholder" />
        </div>
        <div class="form-group">
          <label data-i18n="apiKeys.formKey"></label>
          <input type="text" id="apiKeyForm_key" data-i18n-placeholder="apiKeys.formKeyPlaceholder" />
        </div>
        <div class="form-group">
          <label class="flex items-center gap-2">
            <span class="switch"><input type="checkbox" id="apiKeyForm_enabled" checked /><span class="slider"></span></span>
            <span data-i18n="apiKeys.formEnabled"></span>
          </label>
        </div>

        <div class="form-section-title" data-i18n="apiKeys.sectionBilling"></div>
        <div class="form-grid-2">
          <div class="form-group">
            <label data-i18n="apiKeys.limitCredits"></label>
            <input type="number" id="apiKeyForm_creditLimit" min="0" step="0.01" value="0" />
            <small data-i18n="apiKeys.limitHint"></small>
          </div>
          <div class="form-group">
            <label data-i18n="apiKeys.limitTokens"></label>
            <input type="number" id="apiKeyForm_tokenLimit" min="0" step="1" value="0" />
            <small data-i18n="apiKeys.limitHint"></small>
          </div>
          <div class="form-group">
            <label data-i18n="apiKeys.formMaxConcurrency"></label>
            <select id="apiKeyForm_maxConcurrencyMode">
              <option value="0" data-i18n="apiKeys.concurrencyModeDefault"></option>
              <option value="custom" data-i18n="apiKeys.concurrencyModeCustom"></option>
              <option value="-1" data-i18n="apiKeys.concurrencyModeUnlimited"></option>
            </select>
            <input type="number" id="apiKeyForm_maxConcurrency" min="1" step="1" value="0" class="hidden mt-2" />
            <small data-i18n="apiKeys.formMaxConcurrencyHint"></small>
          </div>
          <div class="form-group">
            <label data-i18n="apiKeys.formExpiresAt"></label>
            <input type="datetime-local" id="apiKeyForm_expiresAt" />
            <small data-i18n="apiKeys.formExpiresAtHint"></small>
          </div>
        </div>

        <div class="form-section-title" data-i18n="apiKeys.sectionBinding"></div>
        <div class="form-group">
          <label data-i18n="apiKeys.formParentKey"></label>
          <select id="apiKeyForm_parentKey"></select>
          <small data-i18n="apiKeys.formParentKeyHint"></small>
        </div>
        <div class="form-group">
          <label data-i18n="apiKeys.formBoundAccounts"></label>
          <div id="apiKeyForm_boundAccounts" class="bound-accounts-list"></div>
          <small data-i18n="apiKeys.formBoundAccountsHint"></small>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" id="apiKeyModalCancelBtn" type="button" data-i18n="apiKeys.cancelBtn"></button>
          <button class="btn btn-primary" id="apiKeyModalSaveBtn" type="button" data-i18n="apiKeys.saveBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Top-up modal -->
  <div id="topupModal" class="modal">
    <div class="modal-content confirm-modal-content">
      <div class="modal-header">
        <span class="modal-title" data-i18n="topup.title"></span>
        <button class="modal-close" id="topupModalClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="topup-card-label">
          <span class="text-xs muted-text" data-i18n="topup.card"></span>
          <span class="font-semibold" id="topupCardName"></span>
        </div>
        <div class="form-group">
          <label data-i18n="topup.amount"></label>
          <input type="number" id="topupAmount" min="0" step="0.01" data-i18n-placeholder="topup.amountPlaceholder" />
        </div>
        <div class="form-group">
          <label data-i18n="topup.note"></label>
          <input type="text" id="topupNote" data-i18n-placeholder="topup.notePlaceholder" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="topupCancelBtn" type="button" data-i18n="common.cancel"></button>
          <button class="btn btn-primary" id="topupSubmitBtn" type="button" data-i18n="topup.submit"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Card detail modal -->
  <div id="keyDetailModal" class="modal">
    <div class="modal-content key-detail-modal-content">
      <div class="modal-header">
        <span class="modal-title"><span data-i18n="keyDetail.title"></span><span class="key-detail-name"
            id="keyDetailName"></span></span>
        <button class="modal-close" id="keyDetailModalClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="key-detail-subtabs" id="keyDetailSubtabs" role="tablist">
          <button type="button" class="key-subtab active" data-subtab="summary" data-i18n="keyDetail.tabSummary"></button>
          <button type="button" class="key-subtab" data-subtab="recharges" data-i18n="keyDetail.tabRecharges"></button>
          <button type="button" class="key-subtab" data-subtab="usage" data-i18n="keyDetail.tabUsage"></button>
          <button type="button" class="key-subtab" data-subtab="children" data-i18n="keyDetail.tabChildren"></button>
        </div>
        <div class="key-detail-content" id="keyDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- API View Modal -->
  <div id="apiViewModal" class="modal">
    <div class="modal-content api-view-modal-content">
      <div class="modal-header">
        <span class="modal-title" id="apiViewTitle"></span>
        <button class="modal-close" id="apiViewModalClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body" id="apiViewBody">
        <div class="api-view-loading"><i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="api.loading"></span></div>
      </div>
    </div>
  </div>

  <!-- Script loader -->
  <script>
    (function () {
      var v = window.__v || Date.now();
      var t = document.createElement('script');
      t.src = '/admin/toast.js?v=' + v;
      document.body.appendChild(t);
      var s = document.createElement('script');
      s.src = '/admin/app.js?v=' + v;
      s.defer = true;
      document.body.appendChild(s);
    })();
  </script>
</body>

</html>
